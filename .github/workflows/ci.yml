name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, mbstring, json
          coverage: none

      - name: Lint PHP sources
        run: php tests/lint.php

      - name: Unit and integration tests
        run: php tests/run.php

  firmware-host:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the portable core under ASan/UBSan
        run: make -C firmware/doorlock-esp8266/test test

  sketch-typecheck:
    name: Sketch typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the sketch against the host stubs
        run: firmware/doorlock-esp8266/test/build_sketch.sh

  # TO ENABLE THIS JOB:
  # 1. Pin esp8266:esp8266@3.1.2 and MFRC522@1.4.11 in the workflow.
  # 2. Provide config.h (non-secret placeholders) in a CI step.
  # 3. Remove `if: false`.
  # 4. Verify the job passes on a test PR before merging.
  # Until then this job must remain skipped, never reported as PASS.
  esp8266-build:
    # BLOCKED: ESP8266 toolchain unavailable in this environment. Do not report as PASS.
    if: false
    name: ESP8266 firmware build (blocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report blocked status
        run: |
          echo 'BLOCKED: ESP8266 toolchain unavailable in this environment. Do not report as PASS.'
          exit 1
